engineStrict: true
# Stale node_modules otherwise fail later with misleading errors like "Cannot find module $app/tsconfig".
verifyDepsBeforeRun: error
# A compromised release is usually pulled within a day, before it can be installed here.
minimumReleaseAge: 1440
# Prebuilt binaries come from optional dependencies, and prepare installs git hooks.
allowBuilds:
  esbuild: false
  simple-git-hooks: false
  workerd: false
