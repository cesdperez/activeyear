scripts:
  setup: |
    #!/usr/bin/env bash
    set -euo pipefail
    pnpm install --frozen-lockfile
    pnpm --silent ports
  archive: |
    #!/usr/bin/env bash
    # Orca reads this from the primary checkout and runs it in the worktree being removed, which may predate scripts/ports.ts.
    [ -f scripts/ports.ts ] || exit 0
    for port in $(node scripts/ports.ts --all); do
      lsof -ti "tcp:$port" -sTCP:LISTEN | xargs kill 2>/dev/null || true
    done
setupAgentStartupPolicy: wait-for-setup
defaultTabs:
  - title: Agent
  - title: Shell
